<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFB86B">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>
<style>
  /* ===== Palette (from user reference) =====
     Sand #DEC47D  Seashell #E0C7B0  Sunshine #C89C5F
     Cacti #B8B292  Foam #EBDEC2       Seabed #8CA3A6  Shore #B0BDBA */
  :root{
    --bg:#1a1410; --panel:#262019; --panel2:#332a21; --line:#4a3d31;
    --txt:#f3e9dc; --muted:#b0a08c; --accent:#e8a76b; --accent2:#c89c5f;
  }
  html[data-theme="light"]{
    --bg:#EBDEC2; --panel:#F5EBD3; --panel2:#FFFFFF; --line:#D4B896;
    --txt:#2A1F14; --muted:#6B5540; --accent:#B8833A; --accent2:#5A8AB5;
  }
  html[data-theme="night"]{
    --bg:#0C1519; --panel:#162127; --panel2:#24343C; --line:#3A3534;
    --txt:#E8D5B7; --muted:#8CA3A6; --accent:#CF9D7B; --accent2:#724B39;
  }
  html[data-theme="violet"]{
    --bg:#2D1B2E; --panel:#3D2845; --panel2:#503560; --line:#6B4D7A;
    --txt:#F6DBC0; --muted:#B08BC0; --accent:#935073; --accent2:#502D55;
  }
  html[data-theme="ocean"]{
    --bg:#0F1E2E; --panel:#1A2E42; --panel2:#243B55; --line:#3A5068;
    --txt:#D4E5F2; --muted:#7A9AB5; --accent:#5BA3D9; --accent2:#3A7AB5;
  }
  html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;}
  .glass2{background:var(--panel2);border:1px solid var(--line);border-radius:12px;}
  .btn{background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;border:none;cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);transition:all .15s;}
  .icon-btn:hover{background:var(--panel2);transform:scale(1.05);}
  .icon-btn:active{transform:scale(0.95);}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:11px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
  .tab-btn{font-size:10px;padding:3px 7px;white-space:nowrap;flex:0 0 auto;word-break:keep-all;}
  .tab-btn span{white-space:nowrap;word-break:keep-all;display:inline-block;}
  .tab-btn{margin:0;gap:3px;}
  .tab-btn svg{width:11px;height:11px;}
  .tab-btn svg{flex:0 0 auto;}
  .chip{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--panel2);border:1px solid var(--line);margin:2px;color:var(--txt);}
  .icon-btn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);}
  .icon-btn:hover{background:var(--panel2);}
  .tab-active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;}
  .task-done{opacity:.5;text-decoration:line-through;}
  .subtask-row{border-left:3px solid var(--accent);margin-left:10px;padding-left:10px;}
  @keyframes lumiFloat{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);}}
  @keyframes halo{0%,100%{filter:drop-shadow(0 0 6px rgba(255,210,150,.4));}50%{filter:drop-shadow(0 0 22px rgba(255,210,150,.85));}}
  .lumi-idle{animation:lumiFloat 3.2s ease-in-out infinite;}
  .lumi-halo{animation:halo 2.4s ease-in-out infinite;}
  .dots span{animation:blink 1.2s infinite;}
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:0;}40%{opacity:1;}}
  .typing-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 2px;animation:lumiFloat 1s infinite;}
  .typing-dot:nth-child(2){animation-delay:.15s;}

<!-- ===== LOGIN GATE ===== -->
<div id="gate" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;">
  <div style="font-size:48px">☁️</div>
  <div style="font-size:20px;font-weight:700;color:var(--txt)">雲小朵 Lumi</div>
  <input type="email" id="loginEmail" placeholder="Email" style="max-width:300px;text-align:center">
  <input type="password" id="loginPw" placeholder="密碼" style="max-width:300px;text-align:center">
  <button onclick="doLogin()" class="btn" style="max-width:300px">登入</button>
  <div id="loginErr" style="color:#C0392B;font-size:13px;display:none"></div>
  <div style="font-size:11px;color:var(--muted)">首次使用會自動建立帳號</div>
</div>
<script>
const SUPA_URL = 'https://imubpdyhqxqpvmnalzxq.supabase.co';
const SUPA_KEY = 'sb_publishable_KxheshgJBN-v_j0ca7epLQ_B24nnAcM';
let supa = null;
function ensureSupa(){
  if(supa) return supa;
  try{
    if(typeof supabase !== 'undefined' && supabase.createClient){
      supa = supabase.createClient(SUPA_URL, SUPA_KEY);
    }
  }catch(e){ console.warn('supabase init failed', e); }
  return supa;
}
ensureSupa();

let cloudUser = null;
let pushTimer = null, pushing = false, pendingPush = false;

/* ---------- login ---------- */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if(!email || !pw){ errEl.textContent='請輸入 Email 和密碼'; errEl.style.display='block'; return; }
  const s = ensureSupa();
  if(!s){ errEl.textContent='無法連線，請檢查網路'; errEl.style.display='block'; return; }
  try {
    let { data, error } = await s.auth.signInWithPassword({ email, password: pw });
    if(error){
      const su = await s.auth.signUp({ email, password: pw });
      if(su.error) throw su.error;
      if(!su.data.session){
        errEl.textContent = '帳號已建立，請再按一次「登入」';
        errEl.style.display = 'block';
        return;
      }
      data = su.data;
    }
    if(data.user){
      cloudUser = data.user;
      localStorage.setItem('lumi_email', email);
      document.getElementById('gate').style.display = 'none';
      await cloudPull();
      refreshAll();
      toast('已同步');
    }
  } catch(e){
    errEl.textContent = e.message || '登入失敗';
    errEl.style.display = 'block';
  }
}

/* ---------- pull: cloud -> device ---------- */
function localHasData(){
  return ((appData.tasks||[]).length > 0)
      || (Object.keys(appData.journals||{}).length > 0);
}
function adoptCloud(cloud){
  const keepTheme = appData.settings && appData.settings.theme;
  appData = Object.assign({}, appData, cloud);
  appData.settings = Object.assign({}, cloud.settings||{}, {
    theme: keepTheme || (cloud.settings||{}).theme
  });
  saveLocalOnly();
}

async function cloudPull(){
  const s = ensureSupa();
  if(!s) return false;
  try{
    const { data, error } = await s.from('lumi_snapshots')
      .select('payload, updated_at').maybeSingle();
    if(error) throw error;

    // no cloud copy yet -> upload this device (only if it actually has data)
    if(!data){
      if(localHasData()) await cloudPushNow();
      return true;
    }

    const cloud = data.payload || {};
    const cloudHasData = ((cloud.tasks||[]).length > 0)
                      || (Object.keys(cloud.journals||{}).length > 0);

    // empty device must never overwrite a cloud copy that has data
    if(!localHasData() && cloudHasData){
      adoptCloud(cloud);
      return true;
    }

    const cloudAt = new Date(data.updated_at).getTime();
    const localAt = appData.updatedAt || 0;
    if(cloudAt > localAt){
      adoptCloud(cloud);
      return true;
    }
    await cloudPushNow();          // this device is newer
    return true;
  }catch(e){
    console.warn('pull failed', e);
    return false;
  }
}

/* ---------- push: device -> cloud (debounced) ---------- */
function cloudPush(){
  if(!ensureSupa()) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ cloudPushNow(); }, 1200);
}

async function cloudPushNow(){
  const s = ensureSupa();
  if(!s) return false;
  if(pushing){ pendingPush = true; return false; }
  pushing = true;
  try{
    let user = cloudUser;
    if(!user){
      const r = await s.auth.getUser();
      user = r.data && r.data.user;
    }
    if(!user) return false;
    cloudUser = user;
    const payload = JSON.parse(JSON.stringify(appData));
    const { error } = await s.from('lumi_snapshots').upsert({
      user_id: user.id,
      payload: payload,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    if(error) throw error;
    localStorage.setItem('lumi_last_sync', new Date().toISOString());
    return true;
  }catch(e){
    console.warn('push failed', e);
    return false;
  }finally{
    pushing = false;
    if(pendingPush){ pendingPush = false; cloudPush(); }
  }
}

/* ---------- startup ---------- */
(async function initAuth(){
  const gateEl = document.getElementById('gate');
  const showGate = ()=>{
    gateEl.style.display = 'flex';
    const savedEmail = localStorage.getItem('lumi_email');
    if(savedEmail && !document.getElementById('loginEmail').value){
      document.getElementById('loginEmail').value = savedEmail;
    }
  };
  if(!ensureSupa()){
    // SDK may still be loading (slow network) - wait briefly then retry
    for(let i=0;i<20 && !ensureSupa();i++) await new Promise(r=>setTimeout(r,250));
    if(!ensureSupa()){ showGate(); return; }
  }
  try{
    const res = await Promise.race([
      ensureSupa().auth.getSession(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 8000))
    ]);
    const session = res && res.data && res.data.session;
    if(!session){ showGate(); return; }
    cloudUser = session.user;
    gateEl.style.display = 'none';   // we have a session: go straight in
    await cloudPull();
    refreshAll();
  }catch(e){
    console.warn('auth init failed', e);
    showGate();
  }
})();
</script>

  <button onclick="switchTab('cal')" data-tab="cal" class="tab-btn chip tab-active"><i data-lucide="calendar-days" class="w-3 h-3"></i><span>日曆</span></button>
  <button onclick="switchTab('all')" data-tab="all" class="tab-btn chip"><i data-lucide="list" class="w-3 h-3"></i><span>全部</span></button>
  <button onclick="switchTab('backlog')" data-tab="backlog" class="tab-btn chip"><i data-lucide="inbox" class="w-3 h-3"></i><span>Backlog</span> <span id="bBadge"></span></button>
  <button onclick="switchTab('journals')" data-tab="journals" class="tab-btn chip"><i data-lucide="book-open" class="w-3 h-3"></i><span>日誌</span></button>
  <button onclick="switchTab('stats')" data-tab="stats" class="tab-btn chip"><i data-lucide="bar-chart-3" class="w-3 h-3"></i><span>統計</span></button>
</nav>

<main class="px-3 py-2 flex-1">

  <!-- CALENDAR TAB -->
  <section id="tab-cal">
    <!-- View switcher -->
    <div class="flex gap-1 mb-2 text-xs">
      <button class="chip view-btn" data-view="list" data-i18n="vlist" onclick="setView('list')">清單</button>
      <button class="chip view-btn" data-view="month" data-i18n="vmonth" onclick="setView('month')">月</button>
      <button class="chip view-btn" data-view="week" data-i18n="vweek" onclick="setView('week')">週</button>
      <button class="chip view-btn" data-view="day3" data-i18n="vday3" onclick="setView('day3')">3日</button>
      <button class="chip view-btn" data-view="day" data-i18n="vday" onclick="setView('day')">日</button>
      <button class="chip view-btn" data-view="year" data-i18n="vyear" onclick="setView('year')">年</button>
    </div>

    <div class="flex items-center justify-between mb-2">
      <button class="icon-btn" onclick="shiftPeriod(-1)"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
      <div class="font-bold text-center flex-1" id="calTitle">--</div>
      <button class="icon-btn" onclick="shiftPeriod(1)"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
    </div>

    <!-- Region toggles -->
    <div class="flex gap-2 mb-2 text-[11px] flex-wrap">
      <label><input type="checkbox" id="holTW" checked onchange="renderCalendar()"> 🇹🇼</label>
      <label><input type="checkbox" id="holCN" checked onchange="renderCalendar()"> 🇨🇳</label>
      <label><input type="checkbox" id="holAR" checked onchange="renderCalendar()"> 🇦🇷</label>
      <span class="ml-auto" id="weatherBox"></span>
    </div>

    <div id="calArea"></div>

    <!-- Selected day panel -->
    <div class="glass p-3 mt-3">
      <div class="flex items-center justify-between mb-2">
        <div><b id="selDateTitle">--</b><div class="text-[11px]" style="color:var(--muted)" id="selDateLunar">--</div></div>
        <button class="btn" onclick="openAddTask(false)"><i data-lucide="plus" class="w-3.5 h-3.5 inline"></i> 新增任務</button>
      </div>
      <div id="selHoliday" class="text-[11px] mb-2" style="color:var(--accent)"></div>
      <div id="selTasks" class="flex flex-col gap-1.5 mb-3"></div>
      <div class="text-xs font-bold mb-1">當日随筆</div>
      <textarea id="dailyJournalInput" rows="2" class="w-full" placeholder="今天發生了什麼？"></textarea>
      <button class="btn-ghost mt-1 text-xs" onclick="saveJournal()">儲存日誌</button>
    </div>
  </section>

  <!-- ALL TASKS -->
  <section id="tab-all" class="hidden">
    <div class="flex gap-2 mb-2">
      <input type="text" id="allSearch" placeholder="搜尋任務..." oninput="renderAll()">
      <select id="allCat" onchange="renderAll()" class="w-auto"></select>
    </div>
    <div id="allList" class="flex flex-col gap-1.5"></div>
  </section>

  <!-- BACKLOG -->
  <section id="tab-backlog" class="hidden">
    <div class="flex justify-between items-center mb-2">
      <b><i data-lucide="inbox" class="w-3 h-3" style="display:inline"></i> 未排程事項</b>
      <button class="btn text-xs" onclick="openAddTask(true)">+ 加入 Backlog</button>
    </div>
    <div id="backlogList" class="flex flex-col gap-1.5"></div>
  </section>

  <!-- JOURNALS -->
  <section id="tab-journals" class="hidden">
    <input type="text" id="journalSearch" placeholder="關鍵字搜尋日誌..." oninput="renderJournals()" class="mb-2">
    <div id="journalsList" class="flex flex-col gap-1.5"></div>
  </section>

  <!-- STATS -->
  <section id="tab-stats" class="hidden">
    <div class="grid grid-cols-3 gap-2 mb-3">
      <div class="glass p-3 text-center"><div class="text-[11px]" style="color:var(--muted)">任務</div><div class="text-xl font-bold" id="stTotal">0</div></div>
      <div class="glass p-3 text-center"><div class="text-[11px]" style="color:var(--muted)">完成</div><div class="text-xl font-bold" id="stDone">0</div></div>
      <div class="glass p-3 text-center"><div class="text-[11px]" style="color:var(--muted)">支出</div><div class="text-xl font-bold" id="stMoney">$0</div></div>
    </div>
    <div class="glass p-3 mb-3">
      <b class="text-sm"><i data-lucide="sparkles" class="w-3.5 h-3.5" style="display:inline"></i> AI 統計助手</b>
      <div class="flex flex-wrap gap-1 mt-2 text-[11px]">
        <button class="chip" onclick="askAI('統計這個月完成了哪些事，總結一下')">本月總結</button>
        <button class="chip" onclick="askAI('這個月花了多少錢？分類說明')">本月花費</button>
        <button class="chip" onclick="askAI('上週完成了哪些任務？')">上週回顧</button>
        <button class="chip" onclick="askAI('我最常延遲哪一類任務？')">延遲分析</button>
      </div>
    </div>
    <div class="glass p-3">
      <b class="text-sm mb-2 block">財務紀錄</b>
      <div id="finList" class="flex flex-col gap-1"></div>
    </div>
  </section>
</main>

<!-- TASK MODAL -->
<div id="taskModal" class="hidden fixed inset-0 z-50 p-3 flex items-center justify-center" style="background:rgba(0,0,0,.6);">
  <div class="glass p-4 w-full max-w-lg max-h-[92vh] overflow-y-auto scroll-thin">
    <div class="flex justify-between items-center mb-3">
      <b id="tmTitle">新增任務</b>
      <button class="icon-btn" onclick="closeTaskModal()"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <form onsubmit="handleSaveTask(event)" class="flex flex-col gap-2.5">
      <input type="hidden" id="editTaskId">
      <div><label class="text-[11px]" style="color:var(--muted)">任務標題</label>
        <input id="tTitle" required placeholder="例如：繳水費" oninput="previewTags(this.value)"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px]" style="color:var(--muted)">分類</label>
          <div class="flex gap-1">
            <select id="tCat" class="flex-1" onchange="onCatChange()"></select>
            <button type="button" class="icon-btn" onclick="addCategory()" title="新增分類"><i data-lucide="plus" class="w-4 h-4"></i></button>
          </div>
        </div>
        <div><label class="text-[11px]" style="color:var(--muted)">優先度</label>
          <select id="tPriority"><option value="low" data-i18n="plow">低</option><option value="mid" selected data-i18n="pmid">中</option><option value="high" data-i18n="phigh">高</option></select>
        </div>
      </div>
      <div><label class="text-[11px]" style="color:var(--muted)">標籤（逗號分隔，自己加或用 AI 建議）</label>
        <input id="tTags" placeholder="例如：繳費, 水費" class="mt-1">
        <div id="aiTagBox" class="mt-1 text-[11px]" style="color:var(--muted)"></div>
      </div>
      <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="tNoDate" onchange="toggleDateBox(this.checked)"> <span>不排日期（Backlog）</span></label>
      <div id="dateBox" class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px]" style="color:var(--muted)">日期</label><input type="date" id="tDate"></div>
        <div><label class="text-[11px]" style="color:var(--muted)">時間</label><input type="time" id="tTime"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px]" style="color:var(--muted)">金額</label><input id="tAmount" type="number" step="0.01" placeholder="0"></div>
        <div><label class="text-[11px]" style="color:var(--muted)">幣別</label>
          <select id="tCurrency"><option>USD</option><option>TWD</option><option>CNY</option><option>ARS</option><option>EUR</option></select>
        </div>
      </div>
      <div><label class="text-[11px]" style="color:var(--muted)">備註</label><textarea id="tNotes" rows="2" placeholder="任務細節..." class="w-full" style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;font-size:13px"></textarea></div>
      <div><label class="text-[11px]" style="color:var(--muted)">地址</label><input id="tLocation" placeholder="地點（會連結 Google 地圖）"></div>
      <div><label class="text-[11px]" style="color:var(--muted)">重複</label>
        <select id="tRepeat" onchange="onRepeatChange(this.value)">
          <option value="none">不重複</option>
          <option value="daily">每天</option>
          <option value="weekly">每週</option>
          <option value="monthly">每月</option>
          <option value="yearly">每年（國曆）</option>
          <option value="lunar_monthly">每月（農曆）</option>
          <option value="lunar_yearly">每年（農曆）</option>
          <option value="custom_days">每隔 N 天</option>
        </select>
        <div id="customDaysBox" class="hidden mt-1"><input type="number" id="tCustomDays" placeholder="天數"></div>
        <div id="lunarDayBox" class="hidden mt-1">
          <label class="text-[11px]" style="color:var(--muted)">農曆日期：</label>
          <select id="tLunarDay"><option value="1">初一</option><option value="2">初二</option><option value="3">初三</option><option value="15">十五</option><option value="20">二十</option></select>
          <div class="text-[10px] mt-1" style="color:var(--muted)">（可自訂其他日）</div>
        </div>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px]" style="color:var(--muted)">提醒</label>
          <button type="button" class="chip" onclick="addReminderRow()">+ 提醒</button>
        </div>
        <div id="remRows" class="flex flex-col gap-1.5"></div>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px]" style="color:var(--muted)">子任務</label>
          <button type="button" class="chip" onclick="addSubtaskRow()">+ 子任務</button>
        </div>
        <div id="subRows" class="flex flex-col gap-1.5"></div>
      </div>
      <div class="flex gap-2 justify-end border-t pt-2" style="border-color:var(--line)">
        <button type="button" class="btn-ghost" onclick="closeTaskModal()">取消</button>
        <button type="submit" class="btn">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 p-3 flex items-center justify-center" style="background:rgba(0,0,0,.6);">
  <div class="glass p-4 w-full max-w-md max-h-[90vh] overflow-y-auto scroll-thin">
    <div class="flex justify-between items-center mb-3"><b>設定</b><button class="icon-btn" onclick="closeSettings()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <div class="flex flex-col gap-2 text-xs">
      <div class="glass2 p-2">
        <b>☁️ Supabase</b>
        <input id="sUrl" placeholder="Project URL" class="mt-1">
        <input id="sKey" placeholder="publishable key" class="mt-1">
        <div class="mt-1" style="color:var(--muted)">今日 AI 額度剩餘：<span id="aiLeft">--</span></div>
      </div>
      <div class="glass2 p-2">
        <b>📍 天氣定位</b>
        <button class="btn-ghost mt-1 w-full" onclick="requestLocation()">使用現在位置</button>
        <div id="locStatus" class="mt-1" style="color:var(--muted)"></div>
      </div>
      <div class="glass2 p-2">
        <b>📦 備份</b>
        <div class="flex gap-1 mt-1">
          <button class="chip" onclick="exportData()">匯出 JSON</button>
          <label class="chip cursor-pointer">匯入 JSON<input type="file" class="hidden" onchange="importData(event)"></label>
        </div>
      </div>
      <button class="btn" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<!-- GLOBAL SEARCH -->
<div id="searchOverlay" class="hidden fixed inset-0 z-50 p-3" style="background:var(--bg)">
  <div class="max-w-2xl mx-auto">
    <div class="flex gap-2 mb-3">
      <input id="gSearch" class="flex-1 text-lg" placeholder="搜尋任務、日誌..." oninput="renderGSearch()">
      <button class="chip" onclick="closeSearch()">關閉</button>
    </div>
    <div id="gResults"></div>
  </div>
</div>

/* ---- lunar helper: never crash if the CDN library is missing ---- */
function hasLunar(){ return typeof Solar !== 'undefined'; }
function lunarOf(y,m,d){
  try{
    if(!hasLunar()) return null;
    const solar = (typeof y==='object') ? Solar.fromDate(y) : Solar.fromYmd(y,m,d);
    return solar.getLunar();
  }catch(e){ return null; }
}

/* Translate the live DOM by phrase substitution (handles JS-rendered content) */
function applyLang(){
  const lang = appData.settings.lang || 'zh';
  if(lang === 'zh') return;
  const dict = I18N[lang] || {};
  const keys = Object.keys(dict).filter(k=>k).sort((a,b)=>b.length-a.length);
  if(!keys.length) return;

  const translate = (str)=>{
    if(!str) return str;
    let out = str;
    for(const k of keys){
      if(out.indexOf(k) !== -1) out = out.split(k).join(dict[k]);
    }
    return out;
  };

  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentElement;
      if(!p) return NodeFilter.FILTER_REJECT;
      const tag = p.tagName;
      if(tag==='SCRIPT'||tag==='STYLE') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const nt = translate(n.nodeValue);
    if(nt !== n.nodeValue) n.nodeValue = nt;
  });

  document.querySelectorAll('[placeholder]').forEach(el=>{
    const v = el.getAttribute('placeholder');
    const nt = translate(v);
    if(nt !== v) el.setAttribute('placeholder', nt);
  });
  document.querySelectorAll('[title]').forEach(el=>{
    const v = el.getAttribute('title');
    const nt = translate(v);
    if(nt !== v) el.setAttribute('title', nt);
  });
  // explicit data-i18n keys for single-char controls
  const VIEW = {vlist:'List', vmonth:'Month', vweek:'Week', vday3:'3 Day', vday:'Day', vyear:'Year',
                plow:'Low', pmid:'Medium', phigh:'High'};
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(VIEW[k]) el.textContent = VIEW[k];
  });
  // weekday header row (日一二三四五六)
  const WD = {'日':'Sun','一':'Mon','二':'Tue','三':'Wed','四':'Thu','五':'Fri','六':'Sat'};
  document.querySelectorAll('.grid-cols-7 > div').forEach(el=>{
    const k = el.textContent.trim();
    if(WD[k] && el.children.length===0 && el.textContent.trim().length===1) el.textContent = WD[k];
  });
}

function hols(m,d){

function renderCalendar(){

      ? upcoming.map(t=>`<div class="glass2 p-2 mb-1 flex justify-between text-sm"><span>${esc(t.title)} <span class="text-[10px] opacity-60">${t.date} ${t.time||''}</span></span><span class="chip">${(t.tags||[]).join(', ')}</span></div>`).join('')

  }

    document.getElementById('calTitle').innerText = isEN()?`${y}/${String(m+1).padStart(2,'0')}`:`${y} 年 ${m+1} 月`;
    let html = '<div class="grid grid-cols-7 gap-1 text-center text-[10px] mb-1" style="color:var(--muted)"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid grid-cols-7 gap-1">';
    const first = new Date(y,m,1).getDay(), dim = new Date(y,m+1,0).getDate(), prev = new Date(y,m,0).getDate();
    const today = fmtKey(new Date());
    for(let i=first-1;i>=0;i--){ html += `<div class="cal-cell other">${prev-i}</div>`; }
    for(let d=1;d<=dim;d++){
      const dk = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const l = lunarOf(y,m+1,d);
      let lt = l ? l.getDayInChinese() : '';
      if(l && l.getDay()===1) lt = l.getMonthInChinese()+'月';
      const h = hols(m+1,d);
      const n = getTasksForDate(dk).length;
      html += `<div class="cal-cell ${dk===today?'today':''} ${dk===selectedKey?'selected':''}" onclick="pickDate('${dk}')">
        <div class="flex justify-between"><b>${d}</b><span class="opacity-70">${lt}</span></div>
        ${h.length?`<div class="text-[8px] text-emerald-600">${h[0]}</div>`:''}
        ${n?`<div class="flex gap-0.5 mt-1 flex-wrap">${Array.from({length:Math.min(n,3)}).map(()=>'<span class="w-1 h-1 rounded-full" style="background:var(--accent)"></span>').join('')}</div>`:''}
      </div>`;
    }
    html += '</div>';
    area.innerHTML = html;
  } else if(calView==='year'){
    document.getElementById('calTitle').innerText = isEN()?`${y}`:`${y} 年`;
    // Heatmap like 得到大腦
    const counts={};
    appData.tasks.forEach(t=>{ if(t.date && !t.isBacklog) counts[t.date]=(counts[t.date]||0)+1; });
    let html = '<div class="glass p-3"><div class="text-center mb-2 text-xs opacity-70">任務密度（顏色越深任務越多）</div><div class="grid grid-cols-12 gap-1">';
    for(let mm=0;mm<12;mm++){
      const dim=new Date(y,mm+1,0).getDate();
      let max=1; for(let d=1;d<=dim;d++){ const c=counts[`${y}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`]||0; if(c>max)max=c; }
      html += `<div class="text-[10px] mb-1 text-center font-bold">${mm+1}月</div>`;
      for(let d=1;d<=dim;d++){
        const dk=`${y}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const c=counts[dk]||0;
        const alpha = c===0?0.08:0.2+0.7*(c/max);
        html += `<div title="${mm+1}/${d}: ${c}項" onclick="pickDate('${dk}')" style="aspect-ratio:1;background:rgba(168,140,255,${alpha});border-radius:2px;cursor:pointer"></div>`;
      }
    }
    html += '</div></div>';
    area.innerHTML = html;
  } else {
    // week / day3 / day — TickTick style time grid
    const days = calView==='week'?7:calView==='day3'?3:1;
    document.getElementById('calTitle').innerText = days===7?(isEN()?'This Week':'本週'):days===3?(isEN()?'3 Days':'3 天'):(isEN()?'Today':'一日');
    const CATS = {payment:'#FFB366', housework:'#9CCC9C', shopping:'#9CB8FF', work:'#D4A5FF', health:'#FFB3C1', other:'#D0D0D0'};
    const H_START=6, H_END=23, ROW=48; // px per hour
    const start = new Date(currentDate);
    if(calView==='week') start.setDate(start.getDate()-start.getDay());
    let html = `<div style="overflow-x:auto"><div style="min-width:${days*140}px">`;
    // header row: day names
    html += '<div class="flex" style="margin-bottom:4px">';
    html += '<div style="width:40px;flex-shrink:0"></div>';
    for(let i=0;i<days;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const today = fmtKey(new Date())===fmtKey(d);
      html += `<div class="flex-1 text-center text-xs ${today?'font-bold':''}" style="${today?'color:var(--accent)':''}">${d.getMonth()+1}/${d.getDate()}</div>`;
    }
    html += '</div>';
    // grid
    html += '<div class="flex relative">';
    // hour labels
    html += `<div style="width:40px;flex-shrink:0">`;
    for(let h=H_START;h<H_END;h++){
      html += `<div style="height:${ROW}px;font-size:9px;color:var(--muted);text-align:right;padding-right:4px">${h}:00</div>`;
    }
    html += '</div>';
    // day columns
    for(let i=0;i<days;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const dk=fmtKey(d);
      const tasks=getTasksForDate(dk).filter(t=>t.time);
      html += `<div class="flex-1 relative" style="border-left:1px solid var(--line)">`;
      // hour lines
      for(let h=H_START;h<H_END;h++){
        html += `<div style="height:${ROW}px;border-bottom:1px solid var(--line)"></div>`;
      }
      // task blocks
      tasks.forEach(t=>{
        const [hh,mm]=(t.time||'00:00').split(':').map(Number);
        const top=(hh-H_START)*ROW+(mm/60)*ROW;
        const dur=ROW/2; // default 30min block
        const color=CATS[t.categoryId]||CATS.other;
        html += `<div onclick="pickDate('${dk}')" style="position:absolute;top:${top}px;left:2px;right:2px;height:${dur}px;background:${color}cc;border-radius:6px;padding:2px 4px;font-size:10px;overflow:hidden;cursor:pointer">${esc(t.title)}</div>`;
      });
      html += '</div>';
    }
    html += '</div></div></div>';
    // all-day / no-time tasks below
    html += '<div class="mt-3">';
    for(let i=0;i<days;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const dk=fmtKey(d);
      const nt=getTasksForDate(dk).filter(t=>!t.time);
      if(nt.length){
        html += `<div class="text-xs mb-1"><b>${d.getMonth()+1}/${d.getDate()}</b> ${nt.map(t=>'<span class="chip">'+esc(t.title)+'</span>').join(' ')}</div>`;
      }
    }
    html += '</div>';
    area.innerHTML = html;
  }
  renderSelected();
}
function pickDate(dk){ selectedKey = dk; renderCalendar(); }

function getTasksForDate(dk){
  return appData.tasks.filter(t=>{
    if(t.isBacklog) return false;
    if(t.date===dk) return true;
    if(t.repeat && t.repeat!=='none' && t.date<dk){
      const [ty,tm,td]=t.date.split('-').map(Number);
      const [cy,cm,cd]=dk.split('-').map(Number);
      if(t.repeat==='daily') return true;
      if(t.repeat==='weekly' && new Date(ty,tm-1,td).getDay()===new Date(cy,cm-1,cd).getDay()) return true;
      if(t.repeat==='monthly' && td===cd) return true;
      if(t.repeat==='yearly' && tm===cm && td===cd) return true;
      if(t.repeat==='lunar_yearly' || t.repeat==='lunar_monthly'){
        const cl = lunarOf(cy,cm,cd);
        if(cl && String(cl.getDay())===String(t.lunarDay)) return true;
      }
      if(t.repeat==='custom_days' && t.customDays){
        const diff = Math.ceil((new Date(cy,cm-1,cd)-new Date(ty,tm-1,td))/86400000);
        if(diff%parseInt(t.customDays)===0) return true;
      }
    }
    return false;
  });
}

/* ==================== AI ==================== */
function getQuota(){
  const t=fmtKey(new Date());
  const l=JSON.parse(localStorage.getItem('lumi_ai_q')||'{}');
  if(l.date!==t) return 30;
  return Math.max(0,30-(l.count||0));
}
function bumpQuota(){
  const t=fmtKey(new Date());
  const l=JSON.parse(localStorage.getItem('lumi_ai_q')||'{}');
  if(l.date!==t){l.date=t;l.count=0;}
  l.count++; localStorage.setItem('lumi_ai_q',JSON.stringify(l));
}
async function lumiCall(payload){
  if(!appData.settings.supabaseUrl) throw new Error('尚未設定 Supabase');
  if(getQuota()<=0) throw new Error('今日 AI 額度已用完');
  const url=`${appData.settings.supabaseUrl}/functions/v1/${appData.settings.edgeFn||'ai-proxy'}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+appData.settings.supabaseKey},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('AI 錯誤 '+r.status);
  bumpQuota();
  return await r.json();
}

  document.getElementById('lumiImg').classList.toggle('lumi-idle',!on);
  document.getElementById('lumiTyping').classList.toggle('hidden',!on);

function appendChat(role,text,withSpeaker){
  const c=document.getElementById('lumiChat');
  const d=document.createElement('div');
  if(role==='user') d.className='flex justify-end';
  d.innerHTML = role==='user'
    ? `<div class="glass2 px-3 py-2 max-w-[85%]" style="background:var(--accent);color:#fff">${esc(text)}</div>`
    : `<div class="glass2 px-3 py-2 max-w-[90%] relative">${text}${withSpeaker?'<button onclick="speakText(this)" style="position:absolute;bottom:4px;right:4px;background:none;border:none;cursor:pointer;font-size:14px;opacity:0.5" title="朗讀">🔊</button>':''}</div>`;
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
async function sendLumi(){
  const inp=document.getElementById('lumiInput');
  const txt=inp.value.trim(); if(!txt)return;
  inp.value='';
  appendChat('user',txt);
  setWriting(true);
  // send every journal entry (sorted by date), capped by total characters
  const jarEntries = Object.entries(appData.journals||{})
    .filter(([k,v])=>v && String(v).trim())
    .sort((a,b)=>a[0].localeCompare(b[0]));
  const jarCapped = {}; let budget = 20000;
  for(const [k,v] of jarEntries){
    const s = String(v);
    if(budget <= 0) break;
    const take = s.length > budget ? s.slice(0,budget) : s;
    jarCapped[k] = take; budget -= take.length;
  }
  const ctx={
    today: fmtKey(new Date()),
    tasks: appData.tasks.map(t=>({id:t.id,title:t.title,date:t.date,time:t.time,amount:t.amount,currency:t.currency,category:t.categoryId,completed:t.completed,tags:t.tags,notes:t.notes,isBacklog:t.isBacklog})),
    journals: jarCapped
  };
  try{
    const r=await lumiCall({action:'chat',message:txt,context:ctx});
    // Execute actions
    const actions = r.actions||[];
    const done = [];
    for(const a of actions){
      try{
        if(a.op==='create_task'){
          const id='task_'+Date.now()+Math.floor(Math.random()*1000);
          appData.tasks.push({id, title:a.data.title||'(未命名)', date:a.data.date||ctx.today, time:a.data.time||'', categoryId:a.data.categoryId||'other', tags:a.data.tags||[], amount:a.data.amount||0, currency:'USD', isBacklog:!a.data.date, reminders:[], subtasks:[], completed:false});
          done.push('✅ 新增任務：'+a.data.title);
        } else if(a.op==='update_task'){
          const t=appData.tasks.find(x=>x.id===a.id);
          if(t){ Object.assign(t, a.data); done.push('✏️ 修改任務：'+t.title); }
        } else if(a.op==='delete_task'){
          const t=appData.tasks.find(x=>x.id===a.id);
          if(t){ appData.tasks=appData.tasks.filter(x=>x.id!==a.id); done.push('🗑 刪除任務：'+t.title); }
        } else if(a.op==='create_journal'){
          appData.journals[a.date]=a.content||''; done.push('📖 寫入日誌：'+a.date);
        } else if(a.op==='append_journal'){
          appData.journals[a.date]=(appData.journals[a.date]||'')+'\n'+(a.content||''); done.push('📖 追加日誌：'+a.date);
        }
      }catch(e){}
    }
    if(actions.length) save();
    refreshAll();
    let reply=r.reply||'(無回應)';
    reply=reply.replace(/(\d{4}-\d{2}-\d{2})/g,'<a href="#" onclick="jumpJournal(\'$1\');return false;" style="color:var(--accent);text-decoration:underline">$1</a>');
    if(done.length) reply += '<div class="mt-2 text-[11px] opacity-70 border-t pt-1" style="border-color:var(--line)">'+done.join('<br>')+'</div>';
    appendChat('lumi', reply, true);
  }catch(e){ appendChat('lumi','⚠️ '+e.message); }
  finally{ setWriting(false); }
}
function askAI(q){ openLumi(); document.getElementById('lumiInput').value=q; sendLumi(); }

// Hold-to-talk voice (WeChat/Doubao style) — long press the input bar
let rec=null, recActive=false, lpTimer=null, lpFired=false;
function pressStart(e){
  lpFired=false;
  lpTimer=setTimeout(()=>{ lpFired=true; startVoice(e); }, 350);
}
function pressMove(e){
  if(lpFired) return;
  clearTimeout(lpTimer); lpTimer=null;
}
function pressEnd(e){
  clearTimeout(lpTimer); lpTimer=null;
  if(recActive){ stopVoice(); }
}
function startVoice(e){
  if(recActive) return;
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ toast('此瀏覽器不支援語音，請用 Chrome'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.lang='zh-TW'; rec.interimResults=true;
  const img=document.getElementById('lumiImg');
  if(img){ img.style.transition='all .2s'; img.style.width='110px'; img.style.height='130px'; img.style.opacity='0.6'; }
  document.getElementById('voiceIdle').classList.add('hidden');
  document.getElementById('voiceListening').classList.remove('hidden');
  const inp=document.getElementById('lumiInput');
  rec.onresult=ev=>{
    let txt='';
    for(const r of ev.results) txt+=r[0].transcript;
    inp.value=txt;
  };
  rec.onerror=ev=>{ toast('🎤 '+ev.error); stopVoice(); };
  rec.onend=()=>{ if(recActive) stopVoice(); };
  try{ rec.start(); recActive=true; }catch(err){ toast('無法啟動麥克風'); }
}
function stopVoice(){
  if(!recActive) return;
  recActive=false;
  try{ rec&&rec.stop(); }catch(e){}
  const img=document.getElementById('lumiImg');
  if(img){ img.style.width=''; img.style.height=''; img.style.opacity=''; }
  document.getElementById('voiceListening').classList.add('hidden');
  document.getElementById('voiceIdle').classList.remove('hidden');
  const v=document.getElementById('lumiInput').value.trim();
  if(v) sendLumi();
}
// TTS read aloud
function speakText(btn){
  const box = btn.parentElement;
  const clone = box.cloneNode(true);
  const sp = clone.querySelector('button'); if(sp) sp.remove();
  const txt = clone.innerText.trim();
  if(!txt) return;
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-TW'; u.rate=1.0;
    speechSynthesis.speak(u);
  } else {
    toast('此瀏覽器不支援朗讀');
  }
}

/* ==================== ALARMS ==================== */
function startAlarms(){
  setInterval(()=>{
    const now=new Date(), today=fmtKey(now);
    const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    appData.tasks.forEach(t=>{
      if(t.date===today && t.time===time && !t.completed && !t._notified){
        t._notified=true;
        toast('⏰ 提醒', t.title);
        // If alarm/both, beep
        const rem = (t.reminders||[]).find(r=>r.type==='at_time');
        if(rem && (rem.method==='alarm'||rem.method==='both')) beep();
      }
    });
  }, 20000);
}
function beep(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value=880; g.gain.value=0.3;
    o.start(); setTimeout(()=>{o.stop();}, 600);
  }catch(e){}
}

window.addEventListener('DOMContentLoaded',()=>{
  load();
  renderAlmanac();

  startAlarms();
  lucide.createIcons();
  applyLang();
  lucide.createIcons();
});
