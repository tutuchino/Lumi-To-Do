<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>
<style>
  /* ===== Palette (from user reference) =====
     Sand #DEC47D  Seashell #E0C7B0  Sunshine #C89C5F
     Cacti #B8B292  Foam #EBDEC2       Seabed #8CA3A6  Shore #B0BDBA */
  :root{
    --bg:#1a1410; --panel:#262019; --panel2:#332a21; --line:#4a3d31;
    --txt:#f3e9dc; --muted:#b0a08c; --accent:#e8a76b; --accent2:#c89c5f;
  }
  html[data-theme="light"]{
    --bg:#EBDEC2; --panel:#F5EBD3; --panel2:#FFFFFF; --line:#E0C7B0;
    --txt:#3E2F1F; --muted:#8a7560; --accent:#C89C5F; --accent2:#8CA3A6;
  }
  html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;}
  .glass2{background:var(--panel2);border:1px solid var(--line);border-radius:12px;}
  .btn{background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;border:none;cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--panel2);border:1px solid var(--line);margin:2px;color:var(--txt);}
  .icon-btn{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);}
  .icon-btn:hover{background:var(--panel2);}
  .tab-active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;}
  .task-done{opacity:.5;text-decoration:line-through;}
  .subtask-row{border-left:3px solid var(--accent);margin-left:10px;padding-left:10px;}
  @keyframes lumiFloat{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);}}
  @keyframes halo{0%,100%{filter:drop-shadow(0 0 6px rgba(255,210,150,.4));}50%{filter:drop-shadow(0 0 22px rgba(255,210,150,.85));}}
  .lumi-idle{animation:lumiFloat 3.2s ease-in-out infinite;}
  .lumi-halo{animation:halo 2.4s ease-in-out infinite;}
  .typing-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 2px;animation:lumiFloat 1s infinite;}
  .typing-dot:nth-child(2){animation-delay:.15s;}
  .typing-dot:nth-child(3){animation-delay:.3s;}
  .scroll-thin::-webkit-scrollbar{width:6px;height:6px;}
  .scroll-thin::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .cal-cell{min-height:64px;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:11px;cursor:pointer;}
  .cal-cell.today{border:2px solid var(--accent);}
  .cal-cell.selected{background:var(--accent);color:#fff;}
  .cal-cell.other{opacity:.3;}
</style>
</head>

    <button class="icon-btn" onclick="openSearch()" title="搜尋"><i data-lucide="search" class="w-4 h-4"></i></button>
    <button class="icon-btn" onclick="openSettings()" title="設定"><i data-lucide="settings" class="w-4 h-4"></i></button>

<!-- Almanac strip -->
<section class="px-3 pt-2">
  <div class="glass p-2.5 flex items-center justify-between text-xs">
    <div><b id="alSolar">--</b><div style="color:var(--muted)" id="alLunar">--</div></div>
    <div class="text-right"><div style="color:var(--accent)" id="alJieqi">--</div><div style="color:var(--muted)" id="alYi">--</div></div>
  </div>
</section>

<!-- Tabs -->
<nav class="px-3 pt-2 flex gap-1 overflow-x-auto scroll-thin text-xs">
  <button onclick="switchTab('cal')" data-tab="cal" class="tab-btn chip tab-active">📅 日曆</button>
  <button onclick="switchTab('all')" data-tab="all" class="tab-btn chip">📋 全部</button>
  <button onclick="switchTab('backlog')" data-tab="backlog" class="tab-btn chip">📥 Backlog <span id="bBadge"></span></button>
  <button onclick="switchTab('journals')" data-tab="journals" class="tab-btn chip">📖 日誌</button>
  <button onclick="switchTab('stats')" data-tab="stats" class="tab-btn chip">📊 統計</button>
</nav>

<main class="px-3 py-2 flex-1">

  <!-- CALENDAR TAB -->
  <section id="tab-cal">
    <!-- View switcher -->
    <div class="flex gap-1 mb-2 text-xs">
      <button class="chip view-btn tab-active" data-view="month" onclick="setView('month')">月</button>
      <button class="chip view-btn" data-view="week" onclick="setView('week')">週</button>
      <button class="chip view-btn" data-view="day3" onclick="setView('day3')">3日</button>
      <button class="chip view-btn" data-view="day" onclick="setView('day')">日</button>
      <button class="chip view-btn" data-view="year" onclick="setView('year')">年</button>
    </div>

    <div class="flex items-center justify-between mb-2">
      <button class="icon-btn" onclick="shiftPeriod(-1)"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
      <div class="font-bold text-center flex-1" id="calTitle">--</div>
      <button class="icon-btn" onclick="shiftPeriod(1)"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
    </div>

    <!-- Region toggles -->
    <div class="flex gap-2 mb-2 text-[11px] flex-wrap">
      <label><input type="checkbox" id="holTW" checked onchange="renderCalendar()"> 🇹🇼</label>
      <label><input type="checkbox" id="holCN" checked onchange="renderCalendar()"> 🇨🇳</label>
      <label><input type="checkbox" id="holAR" checked onchange="renderCalendar()"> 🇦🇷</label>
      <span class="ml-auto" id="weatherBox"></span>
    </div>

    <div id="calArea"></div>

    <!-- Selected day panel -->
    <div class="glass p-3 mt-3">
      <div class="flex items-center justify-between mb-2">
        <div><b id="selDateTitle">--</b><div class="text-[11px]" style="color:var(--muted)" id="selDateLunar">--</div></div>
        <button class="btn" onclick="openAddTask(false)"><i data-lucide="plus" class="w-3.5 h-3.5 inline"></i> 新增任務</button>
      </div>
      <div id="selHoliday" class="text-[11px] mb-2" style="color:var(--accent)"></div>
      <div id="selTasks" class="flex flex-col gap-1.5 mb-3"></div>
      <div class="text-xs font-bold mb-1">當日随筆</div>
      <textarea id="dailyJournalInput" rows="2" class="w-full" placeholder="今天發生了什麼？"></textarea>
      <button class="btn-ghost mt-1 text-xs" onclick="saveJournal()">儲存日誌</button>
    </div>
  </section>

  <!-- ALL TASKS -->
  <section id="tab-all" class="hidden">
    <div class="flex gap-2 mb-2">
      <input type="text" id="allSearch" placeholder="搜尋任務..." oninput="renderAll()">
      <select id="allCat" onchange="renderAll()" class="w-auto"></select>
    </div>
    <div id="allList" class="flex flex-col gap-1.5"></div>
  </section>

  <!-- BACKLOG -->
  <section id="tab-backlog" class="hidden">
    <div class="flex justify-between items-center mb-2">
      <b>📥 未排程事項</b>
      <button class="btn text-xs" onclick="openAddTask(true)">+ 加入 Backlog</button>
    </div>
    <div id="backlogList" class="flex flex-col gap-1.5"></div>
  </section>

  <!-- JOURNALS -->
  <section id="tab-journals" class="hidden">
    <input type="text" id="journalSearch" placeholder="關鍵字搜尋日誌..." oninput="renderJournals()" class="mb-2">
    <div id="journalsList" class="flex flex-col gap-1.5"></div>
  </section>

  <!-- STATS -->
  <section id="tab-stats" class="hidden">
    <div class="grid grid-cols-3 gap-2 mb-3">
      <div class="glass p-3 text-center"><div class="text-[11px]" style="color:var(--muted)">任務</div><div class="text-xl font-bold" id="stTotal">0</div></div>
      <div class="glass p-3 text-center"><div class="text-[11px]" style="color:var(--muted)">完成</div><div class="text-xl font-bold" id="stDone">0</div></div>
      <div class="glass p-3 text-center"><div class="text-[11px]" style="color:var(--muted)">支出</div><div class="text-xl font-bold" id="stMoney">$0</div></div>
    </div>
    <div class="glass p-3 mb-3">
      <b class="text-sm">🤖 AI 統計助手</b>
      <div class="flex flex-wrap gap-1 mt-2 text-[11px]">
        <button class="chip" onclick="askAI('統計這個月完成了哪些事，總結一下')">本月總結</button>
        <button class="chip" onclick="askAI('這個月花了多少錢？分類說明')">本月花費</button>
        <button class="chip" onclick="askAI('上週完成了哪些任務？')">上週回顧</button>
        <button class="chip" onclick="askAI('我最常延遲哪一類任務？')">延遲分析</button>
      </div>
    </div>
    <div class="glass p-3">
      <b class="text-sm mb-2 block">財務紀錄</b>
      <div id="finList" class="flex flex-col gap-1"></div>
    </div>
  </section>
</main>

<!-- TASK MODAL -->
<div id="taskModal" class="hidden fixed inset-0 z-50 p-3 flex items-center justify-center" style="background:rgba(0,0,0,.6);">
  <div class="glass p-4 w-full max-w-lg max-h-[92vh] overflow-y-auto scroll-thin">
    <div class="flex justify-between items-center mb-3">
      <b id="tmTitle">新增任務</b>
      <button class="icon-btn" onclick="closeTaskModal()"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <form onsubmit="handleSaveTask(event)" class="flex flex-col gap-2.5">
      <input type="hidden" id="editTaskId">
      <div><label class="text-[11px]" style="color:var(--muted)">任務標題</label>
        <input id="tTitle" required placeholder="例如：繳水費" oninput="previewTags(this.value)"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px]" style="color:var(--muted)">分類</label>
          <div class="flex gap-1">
            <select id="tCat" class="flex-1"></select>
            <button type="button" class="icon-btn" onclick="addCategory()" title="新增分類"><i data-lucide="plus" class="w-4 h-4"></i></button>
          </div>
        </div>
        <div><label class="text-[11px]" style="color:var(--muted)">優先度</label>
          <select id="tPriority"><option value="low">低</option><option value="mid" selected>中</option><option value="high">高</option></select>
        </div>
      </div>
      <div><label class="text-[11px]" style="color:var(--muted)">標籤（逗號分隔，自己加或用 AI 建議）</label>
        <input id="tTags" placeholder="例如：繳費, 水費" class="mt-1">
        <div id="aiTagBox" class="mt-1 text-[11px]" style="color:var(--muted)"></div>
      </div>
      <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="tNoDate" onchange="toggleDateBox(this.checked)"> 不排日期（Backlog）</label>
      <div id="dateBox" class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px]" style="color:var(--muted)">日期</label><input type="date" id="tDate"></div>
        <div><label class="text-[11px]" style="color:var(--muted)">時間</label><input type="time" id="tTime"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[11px]" style="color:var(--muted)">金額</label><input id="tAmount" type="number" step="0.01" placeholder="0"></div>
        <div><label class="text-[11px]" style="color:var(--muted)">幣別</label>
          <select id="tCurrency"><option>USD</option><option>TWD</option><option>CNY</option><option>ARS</option><option>EUR</option></select>
        </div>
      </div>
      <div><label class="text-[11px]" style="color:var(--muted)">重複</label>
        <select id="tRepeat" onchange="onRepeatChange(this.value)">
          <option value="none">不重複</option>
          <option value="daily">每天</option>
          <option value="weekly">每週</option>
          <option value="monthly">每月</option>
          <option value="yearly">每年（國曆）</option>
          <option value="lunar_yearly">每年（農曆）</option>
          <option value="custom_days">每隔 N 天</option>
        </select>
        <div id="customDaysBox" class="hidden mt-1"><input type="number" id="tCustomDays" placeholder="天數"></div>
        <div id="lunarDayBox" class="hidden mt-1">
          <label class="text-[11px]" style="color:var(--muted)">農曆日期：</label>
          <select id="tLunarDay"><option value="1">初一</option><option value="2">初二</option><option value="3">初三</option><option value="15">十五</option><option value="20">二十</option></select>
          <div class="text-[10px] mt-1" style="color:var(--muted)">（可自訂其他日）</div>
        </div>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px]" style="color:var(--muted)">提醒</label>
          <button type="button" class="chip" onclick="addReminderRow()">+ 提醒</button>
        </div>
        <div id="remRows" class="flex flex-col gap-1.5"></div>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px]" style="color:var(--muted)">子任務</label>
          <button type="button" class="chip" onclick="addSubtaskRow()">+ 子任務</button>
        </div>
        <div id="subRows" class="flex flex-col gap-1.5"></div>
      </div>
      <div class="flex gap-2 justify-end border-t pt-2" style="border-color:var(--line)">
        <button type="button" class="btn-ghost" onclick="closeTaskModal()">取消</button>
        <button type="submit" class="btn">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 p-3 flex items-center justify-center" style="background:rgba(0,0,0,.6);">
  <div class="glass p-4 w-full max-w-md max-h-[90vh] overflow-y-auto scroll-thin">
    <div class="flex justify-between items-center mb-3"><b>設定</b><button class="icon-btn" onclick="closeSettings()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <div class="flex flex-col gap-2 text-xs">
      <div class="glass2 p-2">
        <b>☁️ Supabase</b>
        <input id="sUrl" placeholder="Project URL" class="mt-1">
        <input id="sKey" placeholder="publishable key" class="mt-1">
        <div class="mt-1" style="color:var(--muted)">今日 AI 額度剩餘：<span id="aiLeft">--</span></div>
      </div>
      <div class="glass2 p-2">
        <b>📍 天氣定位</b>
        <button class="btn-ghost mt-1 w-full" onclick="requestLocation()">使用現在位置</button>
        <div id="locStatus" class="mt-1" style="color:var(--muted)"></div>
      </div>
      <div class="glass2 p-2">
        <b>📦 備份</b>
        <div class="flex gap-1 mt-1">
          <button class="chip" onclick="exportData()">匯出 JSON</button>
          <label class="chip cursor-pointer">匯入 JSON<input type="file" class="hidden" onchange="importData(event)"></label>
        </div>
      </div>
      <button class="btn" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<!-- GLOBAL SEARCH -->
<div id="searchOverlay" class="hidden fixed inset-0 z-50 p-3" style="background:var(--bg)">
  <div class="max-w-2xl mx-auto">
    <div class="flex gap-2 mb-3">
      <input id="gSearch" class="flex-1 text-lg" placeholder="搜尋任務、日誌..." oninput="renderGSearch()">
      <button class="chip" onclick="closeSearch()">關閉</button>
    </div>
    <div id="gResults"></div>
  </div>
</div>

<!-- LUMI DRAWER (hidden by default!) -->
<div id="lumiDrawer" class="hidden fixed inset-0 z-50 flex flex-col" style="background:var(--bg);">

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 glass2 px-4 py-2 text-sm shadow-xl"></div>

<script>
/* ==================== DATA ==================== */
const DEFAULT_CATS = [
  {id:'payment',name:'💳 繳費',color:'#C89C5F'},
  {id:'housework',name:'🧹 家務',color:'#8CA3A6'},
  {id:'shopping',name:'🛒 購物',color:'#B8B292'},
  {id:'work',name:'💼 工作',color:'#7B9BC4'},
  {id:'health',name:'🧘 健康',color:'#C48BA0'},
  {id:'other',name:'📌 其他',color:'#999'}
];
let appData = {
  v:9,
  tasks:[], journals:{},
  categories: DEFAULT_CATS,
  settings:{
    supabaseUrl:'https://imubpdyhqxqpvmnalzxq.supabase.co',
    supabaseKey:'sb_publishable_KxheshgJBN-v_j0ca7epLQ_B24nnAcM',
    edgeFn:'ai-proxy',
    holTW:true, holCN:true, holAR:true,
    lat:null, lon:null, theme:'light'
  }
};
let currentDate = new Date();
let selectedKey = fmtKey(new Date());
let calView = 'month';

const HOL = {
  TW:{'01-01':'元旦','02-28':'和平紀念','04-04':'兒童節','05-01':'勞動節','10-10':'國慶','12-25':'聖誕'},
  CN:{'01-01':'元旦','05-01':'勞動節','10-01':'國慶','12-25':'聖誕'},
  AR:{'01-01':'新年','05-01':'勞動節','05-25':'五月革命','07-09':'獨立日','12-25':'聖誕'}
};

/* ==================== STORAGE ==================== */
function load(){
  try{
    const raw = localStorage.getItem('lumi_v9');
    if(raw){
      const d = JSON.parse(raw);
      appData = Object.assign(appData, d);
      appData.settings = Object.assign({holTW:true,holCN:true,holAR:true,theme:'light'}, d.settings||{});
    }
  }catch(e){}
  document.documentElement.setAttribute('data-theme', appData.settings.theme);
  document.getElementById('holTW').checked = appData.settings.holTW!==false;
  document.getElementById('holCN').checked = appData.settings.holCN!==false;
  document.getElementById('holAR').checked = appData.settings.holAR!==false;
  document.getElementById('sUrl').value = appData.settings.supabaseUrl||'';
  document.getElementById('sKey').value = appData.settings.supabaseKey||'';
}
function save(){ try{ localStorage.setItem('lumi_v9', JSON.stringify(appData)); }catch(e){ toast('儲存失敗', e.message); } }
window.addEventListener('beforeunload', save);

function fmtKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t,m=''){
  const el = document.getElementById('toast');
  el.innerHTML = `<b>${t}</b>${m?'<br><span style="color:var(--muted);font-size:11px">'+esc(m)+'</span>':''}`;
  el.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.add('hidden'), 3500);
}

/* ==================== ALMANAC ==================== */
function renderAlmanac(){
  const now = new Date();
  const s = Solar.fromDate(now), l = s.getLunar();
  document.getElementById('alSolar').innerText = `${s.getYear()}.${String(s.getMonth()).padStart(2,'0')}.${String(s.getDay()).padStart(2,'0')} 週${'日一二三四五六'[now.getDay()]}`;
  document.getElementById('alLunar').innerText = `農曆 ${l.getMonthInChinese()}月${l.getDayInChinese()}`;
  document.getElementById('alJieqi').innerText = `節氣：${l.getJieQi()||'—'}`;
  document.getElementById('alYi').innerText = `宜：${(l.getDayYi()||[]).slice(0,3).join(' · ')||'—'}`;
}

/* ==================== CALENDAR ==================== */
function setView(v){
  calView = v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('tab-active', b.dataset.view===v));
  renderCalendar();
}
function shiftPeriod(delta){
  if(calView==='month') currentDate.setMonth(currentDate.getMonth()+delta);
  else if(calView==='year') currentDate.setFullYear(currentDate.getFullYear()+delta);
  else if(calView==='week') currentDate.setDate(currentDate.getDate()+delta*7);
  else if(calView==='day3') currentDate.setDate(currentDate.getDate()+delta*3);
  else currentDate.setDate(currentDate.getDate()+delta);
  renderCalendar();
}
function goToday(){ currentDate = new Date(); selectedKey = fmtKey(new Date()); renderCalendar(); renderSelected(); }

function hols(m,d){
  const k = `${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const out=[];
  if(appData.settings.holTW && HOL.TW[k]) out.push('🇹🇼'+HOL.TW[k]);
  if(appData.settings.holCN && HOL.CN[k]) out.push('🇨🇳'+HOL.CN[k]);
  if(appData.settings.holAR && HOL.AR[k]) out.push('🇦🇷'+HOL.AR[k]);
  return out;
}

function renderCalendar(){
  const area = document.getElementById('calArea');
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  if(calView==='month'){
    document.getElementById('calTitle').innerText = `${y} 年 ${m+1} 月`;
    let html = '<div class="grid grid-cols-7 gap-1 text-center text-[10px] mb-1" style="color:var(--muted)"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid grid-cols-7 gap-1">';
    const first = new Date(y,m,1).getDay(), dim = new Date(y,m+1,0).getDate(), prev = new Date(y,m,0).getDate();
    const today = fmtKey(new Date());
    for(let i=first-1;i>=0;i--){ html += `<div class="cal-cell other">${prev-i}</div>`; }
    for(let d=1;d<=dim;d++){
      const dk = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const l = Solar.fromYmd(y,m+1,d).getLunar();
      let lt = l.getDayInChinese(); if(l.getDay()===1) lt = l.getMonthInChinese()+'月';
      const h = hols(m+1,d);
      const n = getTasksForDate(dk).length;
      html += `<div class="cal-cell ${dk===today?'today':''} ${dk===selectedKey?'selected':''}" onclick="pickDate('${dk}')">
        <div class="flex justify-between"><b>${d}</b><span class="opacity-70">${lt}</span></div>
        ${h.length?`<div class="text-[8px] text-emerald-600">${h[0]}</div>`:''}
        ${n?`<div class="flex gap-0.5 mt-1 flex-wrap">${Array.from({length:Math.min(n,3)}).map(()=>'<span class="w-1 h-1 rounded-full" style="background:var(--accent)"></span>').join('')}</div>`:''}
      </div>`;
    }
    html += '</div>';
    area.innerHTML = html;
  } else if(calView==='year'){
    document.getElementById('calTitle').innerText = `${y} 年`;
    let html = '<div class="grid grid-cols-2 gap-2">';
    for(let mm=0;mm<12;mm++){
      html += `<div class="glass p-2"><div class="text-xs font-bold mb-1">${mm+1} 月</div><div class="grid grid-cols-7 gap-0.5 text-center text-[9px]">`;
      const first = new Date(y,mm,1).getDay(), dim = new Date(y,mm+1,0).getDate();
      for(let i=first-1;i>=0;i--) html += '<div class="opacity-30"></div>';
      for(let d=1;d<=dim;d++){
        const dk = `${y}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="p-0.5 rounded cursor-pointer ${dk===selectedKey?'text-white font-bold':''}" style="${dk===selectedKey?'background:var(--accent)':''}" onclick="pickDate('${dk}')">${d}</div>`;
      }
      html += '</div></div>';
    }
    html += '</div>';
    area.innerHTML = html;
  } else {
    // week / day3 / day
    const days = calView==='week'?7:calView==='day3'?3:1;
    document.getElementById('calTitle').innerText = days===7?'本週':days===3?'3 天':'一日';
    let html = '<div class="flex flex-col gap-2">';
    const start = new Date(currentDate);
    if(calView==='week') start.setDate(start.getDate()-start.getDay());
    for(let i=0;i<days;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const dk = fmtKey(d);
      const tasks = getTasksForDate(dk);
      html += `<div class="glass p-2"><div class="flex justify-between text-xs mb-1"><b>${d.getMonth()+1}/${d.getDate()}</b><span class="opacity-60">${tasks.length} 項</span></div>`;
      html += tasks.map(t=>`<div class="text-[11px] p-1 rounded" style="background:var(--panel2)">${t.time?t.time+' ':''}${esc(t.title)}</div>`).join('')||'<div class="text-[11px] opacity-40">—</div>';
      html += '</div>';
    }
    html += '</div>';
    area.innerHTML = html;
  }
  renderSelected();
}
function pickDate(dk){ selectedKey = dk; renderCalendar(); }

function getTasksForDate(dk){
  return appData.tasks.filter(t=>{
    if(t.isBacklog) return false;
    if(t.date===dk) return true;
    if(t.repeat && t.repeat!=='none' && t.date<dk){
      const td = new Date(t.date), cd = new Date(dk);
      if(t.repeat==='daily') return true;
      if(t.repeat==='weekly' && td.getDay()===cd.getDay()) return true;
      if(t.repeat==='monthly' && td.getDate()===cd.getDate()) return true;
      if(t.repeat==='yearly' && td.getMonth()===cd.getMonth() && td.getDate()===cd.getDate()) return true;
      if(t.repeat==='lunar_yearly'){
        const cl = Solar.fromYmd(cd.getFullYear(),cd.getMonth()+1,cd.getDate()).getLunar();
        if(String(cl.getDay())===String(t.lunarDay)) return true;
      }
      if(t.repeat==='custom_days' && t.customDays){
        const diff = Math.ceil(Math.abs(cd-td)/86400000);
        if(diff%parseInt(t.customDays)===0) return true;
      }
    }
    return false;
  });
}

function previewTags(text){
  const box = document.getElementById('aiTagBox');
  if(!text.trim()){ box.innerText=''; return; }
  // local quick heuristic
  const map=[['繳|費|水電|房租',['付款']],['買|購物|超市',['購物']],['打掃|洗衣|整理',['家務']],['開會|報告|專案',['工作']],['運動|吃藥|瑜伽',['健康']]];
  const tags=new Set(['日常']);
  map.forEach(([k,v])=>{ if(new RegExp(k).test(text)) v.forEach(x=>tags.add(x)); });
  box.innerHTML = '建議：'+Array.from(tags).map(t=>`<span class="chip">#${t}</span>`).join('');
  requestAiTag(text);
}
let pendingAI = null;
async function requestAiTag(text){
  if(!appData.settings.supabaseUrl) return;
  try{
    const r = await lumiCall({action:'autotag', content:text});
    if(r && r.tags){
      pendingAI = r;
      document.getElementById('aiTagBox').innerHTML += `<br>🤖 AI 建議：分類 ${esc(r.category||'')} ${(r.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join('')} <button class="chip" onclick="applyAITags()">採用</button>`;
    }
  }catch(e){}
}
function applyAITags(){
  if(!pendingAI) return;
  document.getElementById('tTags').value = (pendingAI.tags||[]).join(', ');
  pendingAI = null;
}

function handleSaveTask(e){
  e.preventDefault();
  const editId = document.getElementById('editTaskId').value;
  const isBacklog = document.getElementById('tNoDate').checked;
  const reminders = Array.from(document.querySelectorAll('#remRows > div')).map(r=>({
    type: r.querySelector('.rem-type').value,
    method: r.querySelector('.rem-method').value
  }));
  const subtasks = Array.from(document.querySelectorAll('#subRows > div')).map(r=>({
    title: r.querySelector('.sub-title').value.trim(),
    tag: r.querySelector('.sub-tag').value.trim(),
    done: r.querySelector('.sub-done').checked
  })).filter(s=>s.title);
  const tags = document.getElementById('tTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const obj = {
    id: editId||'task_'+Date.now(),
    title: document.getElementById('tTitle').value.trim(),
    categoryId: document.getElementById('tCat').value,
    priority: document.getElementById('tPriority').value,
    amount: document.getElementById('tAmount').value,
    currency: document.getElementById('tCurrency').value,
    isBacklog,
    date: isBacklog?null:document.getElementById('tDate').value,
    time: document.getElementById('tTime').value,
    repeat: document.getElementById('tRepeat').value,
    customDays: document.getElementById('tCustomDays').value,
    lunarDay: document.getElementById('tLunarDay').value,
    reminders, subtasks, tags,
    completed:false
  };
  if(editId){
    const i = appData.tasks.findIndex(t=>t.id===editId);
    if(i>=0){ obj.completed = appData.tasks[i].completed; appData.tasks[i]=obj; }
  } else appData.tasks.push(obj);
  save(); closeTaskModal(); refreshAll(); toast('已儲存', obj.title);
}
function toggleTask(id){ const t=appData.tasks.find(x=>x.id===id); if(t){t.completed=!t.completed; save(); refreshAll();} }
function toggleSub(tid,i){ const t=appData.tasks.find(x=>x.id===tid); if(t&&t.subtasks[i]){t.subtasks[i].done=!t.subtasks[i].done; save(); refreshAll();} }
function delTask(id){ if(!confirm('刪除？'))return; appData.tasks = appData.tasks.filter(x=>x.id!==id); save(); refreshAll(); }
function editTask(id){
  const t = appData.tasks.find(x=>x.id===id); if(!t) return;
  openAddTask(t.isBacklog);
  document.getElementById('editTaskId').value=t.id;
  document.getElementById('tTitle').value=t.title;
  document.getElementById('tCat').value=t.categoryId;
  document.getElementById('tPriority').value=t.priority||'mid';
  document.getElementById('tAmount').value=t.amount||'';
  document.getElementById('tCurrency').value=t.currency||'USD';
  document.getElementById('tDate').value=t.date||selectedKey;
  document.getElementById('tTime').value=t.time||'';
  document.getElementById('tRepeat').value=t.repeat||'none';
  document.getElementById('tTags').value=(t.tags||[]).join(', ');
  document.getElementById('remRows').innerHTML='';
  (t.reminders||[]).forEach(r=>addReminderRow(r.type, r.method||'banner'));
  if(!(t.reminders||[]).length) addReminderRow();
  document.getElementById('subRows').innerHTML='';
  (t.subtasks||[]).forEach(s=>addSubtaskRow(s.title, s.tag, s.done));
}

/* ==================== AI ==================== */
function getQuota(){
  const t=fmtKey(new Date());
  const l=JSON.parse(localStorage.getItem('lumi_ai_q')||'{}');
  if(l.date!==t) return 30;
  return Math.max(0,30-(l.count||0));
}
function bumpQuota(){
  const t=fmtKey(new Date());
  const l=JSON.parse(localStorage.getItem('lumi_ai_q')||'{}');
  if(l.date!==t){l.date=t;l.count=0;}
  l.count++; localStorage.setItem('lumi_ai_q',JSON.stringify(l));
}
async function lumiCall(payload){
  if(!appData.settings.supabaseUrl) throw new Error('尚未設定 Supabase');
  if(getQuota()<=0) throw new Error('今日 AI 額度已用完');
  const url=`${appData.settings.supabaseUrl}/functions/v1/${appData.settings.edgeFn||'ai-proxy'}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+appData.settings.supabaseKey},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('AI 錯誤 '+r.status);
  bumpQuota();
  return await r.json();
}

/* ==================== LUMI CHAT ==================== */
function openLumi(){ document.getElementById('lumiDrawer').classList.remove('hidden'); }
function closeLumi(){ document.getElementById('lumiDrawer').classList.add('hidden'); }
function setWriting(on){
  document.getElementById('lumiImg').classList.toggle('lumi-idle',!on);
  document.getElementById('lumiTyping').classList.toggle('hidden',!on);
}
function appendChat(role,text){
  const c=document.getElementById('lumiChat');
  const d=document.createElement('div');
  if(role==='user') d.className='flex justify-end';
  d.innerHTML = role==='user'
    ? `<div class="glass2 px-3 py-2 max-w-[85%]" style="background:var(--accent);color:#fff">${esc(text)}</div>`
    : `<div class="glass2 px-3 py-2 max-w-[90%]">${text}</div>`;
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
async function sendLumi(){
  const inp=document.getElementById('lumiInput');
  const txt=inp.value.trim(); if(!txt)return;
  inp.value='';
  appendChat('user',txt);
  setWriting(true);
  const ctx={
    tasks: appData.tasks.slice(0,50).map(t=>({title:t.title,date:t.date,amount:t.amount,currency:t.currency,category:t.categoryId,completed:t.completed,tags:t.tags})),
    journals: Object.fromEntries(Object.entries(appData.journals).filter(([k,v])=>v).slice(-30))
  };
  try{
    const r=await lumiCall({action:'chat',message:txt,context:ctx});
    let reply=r.reply||'(無回應)';
    reply=reply.replace(/(\d{4}-\d{2}-\d{2})/g,'<a href="#" onclick="jumpJournal(\'$1\');return false;" style="color:var(--accent);text-decoration:underline">$1</a>');
    appendChat('lumi',reply);
  }catch(e){ appendChat('lumi','⚠️ '+e.message); }
  finally{ setWriting(false); }
}
function askAI(q){ openLumi(); document.getElementById('lumiInput').value=q; sendLumi(); }
function voiceInput(){
  if(!('webkitSpeechRecognition' in window)){ toast('瀏覽器不支援語音'); return; }
  const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang='zh-TW';
  rec.onresult=e=>{ document.getElementById('lumiInput').value=e.results[0][0].transcript; };
  rec.start();
  toast('請說話...');
}

/* ==================== ALARMS ==================== */
function startAlarms(){
  setInterval(()=>{
    const now=new Date(), today=fmtKey(now);
    const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    appData.tasks.forEach(t=>{
      if(t.date===today && t.time===time && !t.completed && !t._notified){
        t._notified=true;
        toast('⏰ 提醒', t.title);
        // If alarm/both, beep
        const rem = (t.reminders||[]).find(r=>r.type==='at_time');
        if(rem && (rem.method==='alarm'||rem.method==='both')) beep();
      }
    });
  }, 20000);
}
function beep(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value=880; g.gain.value=0.3;
    o.start(); setTimeout(()=>{o.stop();}, 600);
  }catch(e){}
}
